[package]
name = "DeepFilterLib"
version = "0.5.7-pre"
authors = ["Hendrik Schröter"]
edition = "2021"
rust-version = "1.74"

[lib]
name = "libdf"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
deep_filter = { features = ["transforms", "logging"], path = "../libDF" }
pyo3 = { version = "0.29", features = [
    "extension-module",
] }
numpy = "0.29"
ndarray.workspace = true
rand = { version = "0.9", optional = true }
rand_distr = { version = "0.5", optional = true }
